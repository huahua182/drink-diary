<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>喝了点啥</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #e3f2fd;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 16px;
  padding-bottom: 40px;
}
.container { width: 100%; max-width: 440px; }

/* ====== 通用卡片 ====== */
.card {
  background: #fff;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 2px 12px rgba(21, 101, 192, 0.08);
  margin-bottom: 12px;
}
.section-label { display: block; font-size: 13px; color: #999; margin-bottom: 8px; font-weight: 500; }
.section { margin-bottom: 16px; }

/* ====== 登录页 ====== */
.login-wrap {
  padding-top: 60px;
  text-align: center;
}
.login-wrap h1 { font-size: 28px; color: #1565c0; font-weight: 700; margin-bottom: 6px; }
.login-sub { font-size: 13px; color: #999; margin-bottom: 28px; }
.nickname-input {
  width: 100%;
  padding: 14px 16px;
  font-size: 17px;
  border: 2px solid #e0e0e0;
  border-radius: 14px;
  outline: none;
  text-align: center;
  background: #fafafa;
  margin-bottom: 12px;
  transition: border-color 0.2s;
}
.nickname-input:focus { border-color: #64b5f6; }
.nickname-input::placeholder { color: #ccc; }
.login-btn {
  width: 100%;
  padding: 14px;
  font-size: 17px;
  font-weight: 600;
  color: #fff;
  background: #64b5f6;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  letter-spacing: 2px;
  transition: all 0.2s;
}
.login-btn:active { transform: scale(0.97); background: #42a5f5; }
.history-list { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.history-chip {
  padding: 8px 14px;
  background: #fff;
  border: 1px solid #e0e0e0;
  border-radius: 20px;
  font-size: 13px;
  color: #555;
  cursor: pointer;
  transition: all 0.2s;
}
.history-chip:active { background: #e3f2fd; border-color: #64b5f6; }
.admin-link { display: inline-block; margin-top: 24px; font-size: 12px; color: #bbb; cursor: pointer; text-decoration: none; }
.admin-link:hover { color: #999; }

/* ====== 管理面板 ====== */
.admin-wrap { padding-top: 20px; }
.admin-wrap h2 { font-size: 20px; color: #333; margin-bottom: 20px; text-align: center; }
.admin-input {
  width: 100%;
  padding: 12px 14px;
  font-size: 15px;
  border: 2px solid #e0e0e0;
  border-radius: 12px;
  outline: none;
  background: #fafafa;
  margin-bottom: 12px;
  transition: border-color 0.2s;
}
.admin-input:focus { border-color: #64b5f6; }
.admin-input::placeholder { color: #ccc; }
.admin-hint { font-size: 11px; color: #999; margin: -8px 0 12px; }
.admin-btn-row { display: flex; gap: 10px; }
.admin-btn-row button { flex: 1; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
.btn-primary { background: #64b5f6; color: #fff; }
.btn-primary:active { background: #42a5f5; }
.btn-ghost { background: #f0f0f0; color: #888; }
.btn-ghost:active { background: #e0e0e0; }

/* ====== 顶部用户栏 ====== */
.user-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.user-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: #1565c0;
  font-weight: 600;
  background: #fff;
  padding: 6px 12px;
  border-radius: 20px;
  box-shadow: 0 1px 4px rgba(21,101,192,0.08);
}
.user-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #64b5f6; }
.switch-btn {
  font-size: 12px;
  color: #999;
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px 8px;
}
.switch-btn:active { color: #1565c0; }
.sync-status { font-size: 11px; color: #aaa; margin-left: 2px; }

/* ====== 头部 ====== */
.header { text-align: center; padding: 12px 0 8px; }
.header h1 { font-size: 22px; color: #1565c0; font-weight: 700; letter-spacing: 2px; }

/* ====== 日历 ====== */
.month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.month-nav button {
  width: 36px; height: 36px; border-radius: 50%; border: none;
  background: #e3f2fd; color: #1565c0; font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all 0.2s;
}
.month-nav button:active { background: #bbdefb; }
.month-title { font-size: 17px; font-weight: 700; color: #333; }
.weekday-row { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; margin-bottom: 4px; }
.weekday-row span { font-size: 12px; color: #999; padding: 4px 0; font-weight: 500; }
.weekday-row span:first-child, .weekday-row span:last-child { color: #bbb; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.day-cell {
  aspect-ratio: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; border-radius: 10px; cursor: pointer; font-size: 14px;
  color: #444; position: relative; transition: background 0.15s;
  -webkit-tap-highlight-color: transparent; user-select: none; gap: 1px;
}
.day-cell:active { background: #e3f2fd; }
.day-cell.other-month { color: #ccc; }
.day-cell.today { font-weight: 700; color: #1565c0; }
.day-cell.today::after {
  content: ''; position: absolute; bottom: 4px; left: 50%;
  transform: translateX(-50%); width: 5px; height: 5px;
  border-radius: 50%; background: #64b5f6;
}
.day-cell.selected { background: #64b5f6; color: #fff; font-weight: 600; }
.day-cell.selected.today { color: #fff; }
.day-cell.selected.today::after { background: #fff; }
.day-icons { display: flex; gap: 2px; justify-content: center; flex-wrap: wrap; }
.day-badge {
  font-size: 8px; color: #fff; font-weight: 700;
  padding: 1px 3px; border-radius: 2px; line-height: 1.2;
}

/* ====== 统计 ====== */
.stat-item {
  background: #e3f2fd; border-radius: 12px; padding: 10px 12px; text-align: center;
}
.stat-icon { font-size: 20px; }
.stat-label { font-size: 11px; color: #777; margin-top: 2px; }
.stat-value { font-size: 15px; color: #1565c0; font-weight: 700; margin-top: 1px; }

/* ====== 表单 ====== */
.form-toggle {
  width: 100%; padding: 12px; font-size: 15px; font-weight: 600;
  color: #64b5f6; background: #fff; border: 2px dashed #64b5f6;
  border-radius: 12px; cursor: pointer; transition: all 0.2s;
  letter-spacing: 1px; -webkit-tap-highlight-color: transparent; margin-bottom: 12px;
}
.form-toggle:active { background: #e3f2fd; }
.form-wrap { display: none; margin-bottom: 12px; }
.form-wrap.open { display: block; }

.date-input, .text-input {
  width: 100%; padding: 12px 14px; font-size: 16px;
  border: 2px solid #e0e0e0; border-radius: 12px; outline: none;
  color: #333; background: #fafafa; transition: border-color 0.2s; -webkit-appearance: none;
}
.date-input:focus, .text-input:focus { border-color: #64b5f6; }
.text-input::placeholder { color: #bbb; }

.brand-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.brand-btn {
  padding: 8px 2px; font-size: 13px; font-weight: 500;
  border: 2px solid #e8e8e8; border-radius: 10px; background: #fafafa;
  cursor: pointer; text-align: center; color: #555; transition: all 0.2s;
  -webkit-tap-highlight-color: transparent; user-select: none; outline: none;
}
.brand-btn:active { transform: scale(0.94); }
.brand-btn.selected { border-color: #64b5f6; background: #e3f2fd; color: #1565c0; font-weight: 600; }
.brand-btn-initial {
  display: block; width: 22px; height: 22px; border-radius: 50%;
  color: #fff; font-size: 11px; font-weight: 700; line-height: 22px;
  text-align: center; margin: 0 auto 3px;
}
.brand-btn.custom { border-style: dashed; position: relative; }
.brand-btn.custom .brand-del {
  position: absolute; top: -5px; right: -5px; width: 18px; height: 18px;
  border-radius: 50%; background: #eee; border: none; font-size: 10px;
  color: #999; cursor: pointer; display: none; align-items: center;
  justify-content: center; line-height: 1;
}
.brand-btn.custom:hover .brand-del, .brand-btn.custom:active .brand-del { display: flex; }
.brand-add {
  padding: 8px 4px; font-size: 20px; font-weight: 300;
  border: 2px dashed #d0d0d0; border-radius: 10px; background: #fafafa;
  cursor: pointer; text-align: center; color: #bbb; transition: all 0.2s;
  -webkit-tap-highlight-color: transparent; user-select: none;
  display: flex; align-items: center; justify-content: center; outline: none;
}
.brand-add:active { background: #e3f2fd; color: #64b5f6; border-color: #64b5f6; }
.brand-input-wrap { display: flex; gap: 6px; margin-top: 8px; }
.brand-input-wrap.hidden { display: none; }
.brand-input {
  flex: 1; padding: 8px 10px; font-size: 14px;
  border: 2px solid #e0e0e0; border-radius: 8px; outline: none; background: #fafafa;
}
.brand-input:focus { border-color: #64b5f6; }
.brand-input::placeholder { color: #ccc; font-size: 13px; }
.brand-confirm {
  padding: 8px 14px; font-size: 13px; font-weight: 600; color: #fff;
  background: #64b5f6; border: none; border-radius: 8px; cursor: pointer;
  white-space: nowrap; -webkit-tap-highlight-color: transparent;
}
.brand-confirm:active { background: #42a5f5; }

.option-row { display: flex; gap: 8px; }
.option-row.cols-5 > * { flex: 1; }
.option-btn {
  flex: 1; padding: 10px 6px; font-size: 13px; font-weight: 500;
  border: 2px solid #e8e8e8; border-radius: 10px; background: #fafafa;
  cursor: pointer; text-align: center; color: #666; transition: all 0.2s;
  -webkit-tap-highlight-color: transparent; user-select: none;
}
.option-btn:active { transform: scale(0.94); }
.option-btn.selected { border-color: #64b5f6; background: #e3f2fd; color: #1565c0; font-weight: 600; }
.emoji-row { display: flex; gap: 8px; }
.emoji-btn {
  flex: 1; padding: 10px 0; font-size: 26px; border: 2px solid #e8e8e8;
  border-radius: 12px; background: #fafafa; cursor: pointer; text-align: center;
  transition: all 0.2s; -webkit-tap-highlight-color: transparent; user-select: none;
}
.emoji-btn:active { transform: scale(0.92); }
.emoji-btn.selected { border-color: #64b5f6; background: #e3f2fd; transform: scale(1.08); }
.price-input {
  width: 140px; padding: 12px 14px; font-size: 16px;
  border: 2px solid #e0e0e0; border-radius: 12px; outline: none;
  color: #333; background: #fafafa; transition: border-color 0.2s;
}
.price-input:focus { border-color: #64b5f6; }
.price-input::placeholder { color: #bbb; }
.price-wrap { display: flex; align-items: center; gap: 6px; }
.price-wrap span { color: #888; font-size: 15px; }
.save-btn {
  width: 100%; padding: 14px; font-size: 17px; font-weight: 600;
  color: #fff; background: #64b5f6; border: none; border-radius: 12px;
  cursor: pointer; transition: all 0.2s; letter-spacing: 2px;
  -webkit-tap-highlight-color: transparent; margin-top: 2px;
}
.save-btn:active { transform: scale(0.97); background: #42a5f5; }

/* ====== 记录列表 ====== */
.list-header { font-size: 14px; color: #1565c0; font-weight: 600; margin-bottom: 8px; padding-left: 4px; }
.empty-tip { text-align: center; color: #aaa; font-size: 14px; padding: 24px 0; }
.record-item {
  display: flex; align-items: flex-start; padding: 12px 14px;
  background: #fff; border-radius: 12px; margin-bottom: 8px;
  box-shadow: 0 1px 6px rgba(21, 101, 192, 0.05); gap: 10px;
}
.record-brand-badge {
  width: 36px; height: 36px; border-radius: 10px; display: flex;
  align-items: center; justify-content: center; font-size: 15px;
  font-weight: 700; color: #fff; flex-shrink: 0;
}
.record-info { flex: 1; min-width: 0; }
.record-top { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.record-brand { font-size: 13px; color: #555; font-weight: 600; }
.record-name { font-size: 15px; color: #333; font-weight: 500; margin-bottom: 4px; }
.record-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 11px; padding: 3px 8px; border-radius: 6px; background: #f0f4ff; color: #5c7cb0; font-weight: 500; }
.record-rating { font-size: 17px; }
.record-price { font-size: 14px; color: #888; font-weight: 500; }
.record-right { text-align: right; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.record-del {
  width: 26px; height: 26px; border-radius: 50%; border: none;
  background: #f0f0f0; color: #bbb; font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.record-del:active { background: #ffebee; color: #e53935; }
.toast {
  position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
  background: #333; color: #fff; padding: 10px 24px; border-radius: 20px;
  font-size: 14px; pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 100;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="container" id="app">
  <!-- ====== 登录视图 ====== -->
  <div id="loginView" class="login-wrap">
    <h1>☕ 喝了点啥</h1>
    <div class="login-sub">记录每一天的饮品</div>
    <input type="text" class="nickname-input" id="nicknameInput" placeholder="输入你的昵称" maxlength="20" autocomplete="off">
    <button class="login-btn" id="loginBtn">进入</button>
    <div class="history-list" id="historyList"></div>
    <a class="admin-link" id="adminLink">⚙ 管理员设置</a>
  </div>

  <!-- ====== 管理视图 ====== -->
  <div id="adminView" style="display:none">
    <div class="admin-wrap">
      <h2>🔐 管理员设置</h2>
      <div class="card">
        <div class="section">
          <span class="section-label">管理密码</span>
          <input type="password" class="admin-input" id="adminPassInput" placeholder="输入管理密码">
          <div class="admin-hint">默认密码：123456</div>
        </div>
        <div class="section">
          <span class="section-label">GitHub Token</span>
          <input type="password" class="admin-input" id="tokenInput" placeholder="ghp_xxxxxxxxxxxx">
          <div class="admin-hint">创建地址：github.com/settings/tokens → 勾选 repo → 生成</div>
        </div>
        <div class="section">
          <span class="section-label">仓库（用户名/仓库名）</span>
          <input type="text" class="admin-input" id="repoInput" placeholder="huahua182/drink-diary">
        </div>
        <div class="section">
          <span class="section-label">新管理员密码（不改就留空）</span>
          <input type="password" class="admin-input" id="newPassInput" placeholder="留空则不修改">
        </div>
        <div class="admin-btn-row">
          <button class="btn-ghost" id="adminBackBtn">返回</button>
          <button class="btn-primary" id="adminSaveBtn">保存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ====== 主视图 ====== -->
  <div id="mainView" style="display:none">
    <div class="user-bar">
      <div class="user-badge">
        <span class="dot"></span><span id="currentUserLabel"></span>
        <span class="sync-status" id="syncStatus"></span>
      </div>
      <button class="switch-btn" id="switchUserBtn">切换</button>
    </div>
    <div class="header"><h1>☕ 喝了点啥</h1></div>

    <!-- 日历 -->
    <div class="card">
      <div class="month-nav">
        <button id="btnPrev">◀</button>
        <span class="month-title" id="monthTitle"></span>
        <button id="btnNext">▶</button>
      </div>
      <div class="weekday-row">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <!-- 统计 -->
    <div class="card">
      <div class="stat-item" id="statItem"></div>
    </div>

    <!-- 表单 -->
    <button class="form-toggle" id="formToggle">➕ 添加记录</button>
    <div class="form-wrap" id="formWrap">
      <div class="card">
        <div class="section">
          <span class="section-label">📅 日期</span>
          <input type="date" class="date-input" id="dateInput">
        </div>
        <div class="section">
          <span class="section-label">🏪 选择品牌</span>
          <div class="brand-grid" id="brandGrid"></div>
          <div class="brand-input-wrap hidden" id="brandInputWrap">
            <input type="text" class="brand-input" id="brandInput" placeholder="输入品牌名...">
            <button class="brand-confirm" id="brandConfirm">添加</button>
          </div>
        </div>
        <div class="section">
          <span class="section-label">📝 饮品名称（选填）</span>
          <input type="text" class="text-input" id="nameInput" placeholder="比如：伯牙绝弦、生椰拿铁...">
        </div>
        <div class="section">
          <span class="section-label">🍬 糖度</span>
          <div class="option-row cols-5" id="sugarRow"></div>
        </div>
        <div class="section">
          <span class="section-label">🧊 冰度</span>
          <div class="option-row cols-5" id="iceRow"></div>
        </div>
        <div class="section">
          <span class="section-label">👅 味道评价</span>
          <div class="emoji-row" id="emojiRow"></div>
        </div>
        <div class="section">
          <span class="section-label">💰 价格（选填）</span>
          <div class="price-wrap">
            <span>¥</span>
            <input type="number" class="price-input" id="priceInput" placeholder="18" step="0.01" min="0">
          </div>
        </div>
        <button class="save-btn" id="saveBtn">保存记录</button>
      </div>
    </div>

    <!-- 记录 -->
    <div class="list-header" id="listHeader">📋 今日记录</div>
    <div id="listContainer"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ==================== 常量 ==================== */
const ADMIN_KEY = 'admin_config_v1';
const USERS_KEY = 'known_users';
const CUR_USER_KEY = 'current_user';

const presetBrands = [
  { name: '霸王茶姬', color: '#c8a25c' },
  { name: '喜茶',     color: '#f4a460' },
  { name: '奈雪的茶', color: '#7bcfa6' },
  { name: '茶百道',   color: '#5b8c5a' },
  { name: '古茗',     color: '#c9956b' },
  { name: '蜜雪冰城', color: '#e53935' },
  { name: '瑞幸',     color: '#2563a8' },
  { name: '库迪',     color: '#e8753c' },
  { name: '星巴克',   color: '#00704a' },
  { name: '一点点',   color: '#7cb342' },
  { name: '沪上阿姨', color: '#d81b60' },
  { name: '茶颜悦色', color: '#8b4513' },
];
const customColors = ['#7e57c2','#26a69a','#ef5350','#ff7043','#42a5f5','#ab47bc','#66bb6a','#ffa726','#8d6e63','#78909c'];
const coffeeBrands = new Set(['瑞幸', '库迪', '星巴克']);
const sugarOptions = ['无糖', '三分糖', '五分糖', '七分糖', '全糖'];
const iceOptions = ['热', '常温', '去冰', '少冰', '正常冰'];
const emojiOptions = ['😫','😐','🙂','😊','🤩'];

const today = new Date();
const todayStr = today.toISOString().split('T')[0];

/* ==================== 全局状态 ==================== */
let currentUser = '';
let adminConfig = null;
let viewYear, viewMonth, selectedDate;
let selectedBrand = '', selectedSugar = '', selectedIce = '', selectedEmoji = '';
viewYear = today.getFullYear();
viewMonth = today.getMonth() + 1;
selectedDate = todayStr;

/* ==================== 工具 ==================== */
const $ = id => document.getElementById(id);
let toastTimer;
function showToast(msg) {
  clearTimeout(toastTimer);
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}
function escapeHtml(str) {
  const d = document.createElement('div'); d.textContent = str; return d.innerHTML;
}
function getAdminConfig() {
  try { return JSON.parse(localStorage.getItem(ADMIN_KEY)) || null; } catch { return null; }
}
function saveAdminConfig(cfg) { localStorage.setItem(ADMIN_KEY, JSON.stringify(cfg)); }
function getKnownUsers() {
  try { return JSON.parse(localStorage.getItem(USERS_KEY)) || []; } catch { return []; }
}
function addKnownUser(nick) {
  const list = getKnownUsers().filter(u => u !== nick);
  list.unshift(nick);
  if (list.length > 20) list.length = 20;
  localStorage.setItem(USERS_KEY, JSON.stringify(list));
}
function getRecordsKey(user) { return 'drink_' + user; }
function getBrandsKey(user) { return 'brands_' + user; }
function getRecords(user) {
  try { return JSON.parse(localStorage.getItem(getRecordsKey(user))) || []; } catch { return []; }
}
function saveRecordsLocal(user, records) {
  localStorage.setItem(getRecordsKey(user), JSON.stringify(records));
}
function getCustomBrands(user) {
  try { return JSON.parse(localStorage.getItem(getBrandsKey(user))) || []; } catch { return []; }
}
function saveCustomBrandsLocal(user, list) {
  localStorage.setItem(getBrandsKey(user), JSON.stringify(list));
}
function getAllBrands(user) {
  return [...presetBrands, ...getCustomBrands(user)];
}
function getBrandColor(name, user) {
  const b = getAllBrands(user).find(b => b.name === name);
  return b ? b.color : '#999';
}

/* ==================== GitHub API ==================== */
function ghApi(path, method, body) {
  if (!adminConfig || !adminConfig.token) return Promise.reject('no config');
  const opts = {
    method,
    headers: { Authorization: 'Bearer ' + adminConfig.token, 'Content-Type': 'application/json' }
  };
  if (body) opts.body = JSON.stringify(body);
  return fetch('https://api.github.com' + path, opts).then(r => {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  });
}

function ghReadFile(nickname) {
  return ghApi('/repos/' + adminConfig.repo + '/contents/data_' + nickname + '.json', 'GET')
    .then(data => JSON.parse(atob(data.content)));
}


function toBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}

function ghWriteFile(nickname, records) {
  const path = 'data_' + nickname + '.json';
  return ghApi('/repos/' + adminConfig.repo + '/contents/' + path, 'GET').then(r => ({ sha: r.sha })).catch(() => ({}))
    .then(existing => {
      const content = toBase64(JSON.stringify(records, null, 2));
      return ghApi('/repos/' + adminConfig.repo + '/contents/' + path, 'PUT', {
        message: '更新 ' + nickname + ' 的记录',
        content,
        sha: existing.sha
      });
    });
}

function syncFromGitHub(nickname) {
  if (!adminConfig || !adminConfig.token) {
    $('syncStatus').textContent = '未配置';
    return Promise.resolve(null);
  }
  $('syncStatus').textContent = '同步中...';
  return ghReadFile(nickname).then(records => {
    if (records && Array.isArray(records)) {
      saveRecordsLocal(nickname, records);
    }
    $('syncStatus').textContent = '✓';
    return records;
  }).catch(err => {
    if (err.message === '404') {
      $('syncStatus').textContent = '✓';
    } else {
      $('syncStatus').textContent = err.message || '离线';
    }
    return null;
  });
}

function syncToGitHub(nickname) {
  if (!adminConfig || !adminConfig.token) return;
  const records = getRecords(nickname);
  ghWriteFile(nickname, records).then(() => {
    $('syncStatus').textContent = '✓';
  }).catch(() => {
    $('syncStatus').textContent = '离线';
  });
}

function syncBrandsToGitHub(nickname) {
  if (!adminConfig || !adminConfig.token) return;
  const brands = getCustomBrands(nickname);
  const path = 'brands_' + nickname + '.json';
  return ghApi('/repos/' + adminConfig.repo + '/contents/' + path, 'GET').then(r => ({ sha: r.sha })).catch(() => ({}))
    .then(existing => {
      const content = toBase64(JSON.stringify(brands, null, 2));
      return ghApi('/repos/' + adminConfig.repo + '/contents/' + path, 'PUT', {
        message: '更新 ' + nickname + ' 的品牌',
        content,
        sha: existing.sha
      });
    });
}

/* ==================== 视图管理 ==================== */
function showLoginView() {
  $('loginView').style.display = '';
  $('adminView').style.display = 'none';
  $('mainView').style.display = 'none';
  renderHistoryChips();
  $('nicknameInput').focus();
}

function showAdminView() {
  $('loginView').style.display = 'none';
  $('adminView').style.display = '';
  $('mainView').style.display = 'none';
  adminConfig = getAdminConfig();
  $('adminPassInput').value = '';
  $('tokenInput').value = adminConfig ? adminConfig.token : '';
  $('repoInput').value = adminConfig ? adminConfig.repo : 'huahua182/drink-diary';
  $('newPassInput').value = '';
}

function showMainView(user) {
  currentUser = user;
  localStorage.setItem(CUR_USER_KEY, user);
  addKnownUser(user);
  $('loginView').style.display = 'none';
  $('adminView').style.display = 'none';
  $('mainView').style.display = '';
  $('currentUserLabel').textContent = user;
  adminConfig = getAdminConfig();

  // 迁移旧数据
  const oldRecords = localStorage.getItem('drink_records_v2');
  if (oldRecords && !localStorage.getItem(getRecordsKey(user))) {
    try {
      saveRecordsLocal(user, JSON.parse(oldRecords));
      const oldBrands = localStorage.getItem('custom_brands');
      if (oldBrands) saveCustomBrandsLocal(user, JSON.parse(oldBrands));
      localStorage.removeItem('drink_records_v2');
      localStorage.removeItem('custom_brands');
    } catch {}
  }

  // 重置表单状态
  selectedBrand = ''; selectedSugar = ''; selectedIce = ''; selectedEmoji = '';
  $('formWrap').classList.remove('open');
  $('formToggle').textContent = '➕ 添加记录';
  $('nameInput').value = ''; $('priceInput').value = '';
  $('brandInputWrap').classList.add('hidden'); $('brandInput').value = '';

  buildBrandGrid();
  buildOptions();
  renderCalendar();
  renderStats();
  renderList();
  updateListHeader();
  $('dateInput').value = selectedDate;

  // 同步
  syncFromGitHub(user).then(ghRecords => {
    if (ghRecords) {
      renderCalendar(); renderStats(); renderList();
    }
  });

  // 同步品牌
  if (adminConfig && adminConfig.token) {
    const bPath = 'brands_' + user + '.json';
    ghApi('/repos/' + adminConfig.repo + '/contents/' + bPath, 'GET')
      .then(data => {
        const brands = JSON.parse(atob(data.content));
        saveCustomBrandsLocal(user, brands);
        buildBrandGrid();
      }).catch(() => {});
  }
}

  if (!nick) { showToast('请输入昵称'); return; }

});
$('nicknameInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });

function renderHistoryChips() {
  const users = getKnownUsers();
  const container = $('historyList');
  if (users.length === 0) { container.innerHTML = ''; return; }
  container.innerHTML = users.map(u =>
    `<span class="history-chip" data-user="${escapeHtml(u)}">${escapeHtml(u)}</span>`
  ).join('');

$('adminLink').addEventListener('click', () => { showAdminView(); });
$('switchUserBtn').addEventListener('click', () => { showLoginView(); });

/* ==================== 管理逻辑 ==================== */
$('adminBackBtn').addEventListener('click', () => { showLoginView(); });
$('adminSaveBtn').addEventListener('click', () => {
  const pass = $('adminPassInput').value;
  const token = $('tokenInput').value.trim();
  const repo = $('repoInput').value.trim();
  const newPass = $('newPassInput').value.trim();

/* ==================== 品牌 / 选项构建 ==================== */
function buildBrandGrid() {
  const grid = $('brandGrid');
  grid.innerHTML = '';
  const allBrands = getAllBrands(currentUser);
  const customBrands = getCustomBrands(currentUser);

  allBrands.forEach((b, idx) => {
    const isCustom = idx >= presetBrands.length;
    const btn = document.createElement('button');
    btn.className = 'brand-btn' + (isCustom ? ' custom' : '');
    btn.innerHTML = `<span class="brand-btn-initial" style="background:${b.color}">${b.name.charAt(0)}</span>${b.name}`;

    if (isCustom) {
      const del = document.createElement('button');
      del.className = 'brand-del'; del.textContent = '×';
      del.addEventListener('click', e => {
        e.stopPropagation();
        const updated = getCustomBrands(currentUser).filter(cb => cb.name !== b.name);
        saveCustomBrandsLocal(currentUser, updated);
        syncBrandsToGitHub(currentUser);
        if (selectedBrand === b.name) selectedBrand = '';
        buildBrandGrid(); renderCalendar(); renderStats(); renderList();
      });
      btn.appendChild(del);
    }

    if (b.name === selectedBrand) btn.classList.add('selected');
    btn.addEventListener('click', () => {
      if (selectedBrand === b.name) { selectedBrand = ''; btn.classList.remove('selected'); }
      else {
        grid.querySelectorAll('button.brand-btn').forEach(el => el.classList.remove('selected'));
        selectedBrand = b.name; btn.classList.add('selected');
      }
    });
    grid.appendChild(btn);
  });

  const addBtn = document.createElement('button');
  addBtn.className = 'brand-add'; addBtn.textContent = '+';
  addBtn.addEventListener('click', () => {
    $('brandInputWrap').classList.toggle('hidden'); $('brandInput').focus();
  });
  grid.appendChild(addBtn);
}

function buildOptions() {
  [$('sugarRow'), $('iceRow'), $('emojiRow')].forEach(r => r.innerHTML = '');
  const groups = [
    ['sugarRow', sugarOptions, () => selectedSugar, v => { selectedSugar = v; }],
    ['iceRow', iceOptions, () => selectedIce, v => { selectedIce = v; }],
    ['emojiRow', emojiOptions, () => selectedEmoji, v => { selectedEmoji = v; }],
  ];
  groups.forEach(([containerId, options, getter, setter]) => {
    const row = document.getElementById(containerId);
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = containerId === 'emojiRow' ? 'emoji-btn' : 'option-btn';
      btn.textContent = opt;
      btn.addEventListener('click', () => {
        if (getter() === opt) { setter(''); btn.classList.remove('selected'); }
        else {
          row.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
          setter(opt); btn.classList.add('selected');
        }
      });
      row.appendChild(btn);
    });
  });
}

$('brandConfirm').addEventListener('click', () => {
  const input = $('brandInput'); const name = input.value.trim();
  if (!name) return;
  if (getAllBrands(currentUser).some(b => b.name === name)) { showToast('该品牌已存在'); return; }
  const list = getCustomBrands(currentUser);
  list.push({ name, color: customColors[list.length % customColors.length] });
  saveCustomBrandsLocal(currentUser, list);
  syncBrandsToGitHub(currentUser);
  input.value = ''; $('brandInputWrap').classList.add('hidden');
  buildBrandGrid(); showToast('已添加 ✓');
});
$('brandInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('brandConfirm').click(); });

function resetForm() {
  selectedBrand = ''; selectedSugar = ''; selectedIce = ''; selectedEmoji = '';
  $('nameInput').value = ''; $('priceInput').value = '';
  document.querySelectorAll('#formWrap .brand-btn, #formWrap .option-btn, #formWrap .emoji-btn')
    .forEach(b => b.classList.remove('selected'));
  $('brandInputWrap').classList.add('hidden'); $('brandInput').value = '';
}

/* ==================== 表单 ==================== */
$('formToggle').addEventListener('click', () => {
  const isOpen = $('formWrap').classList.toggle('open');
  $('formToggle').textContent = isOpen ? '✕ 收起表单' : '➕ 添加记录';
  if (isOpen) { $('dateInput').value = selectedDate; $('formWrap').scrollIntoView({ behavior: 'smooth' }); }
});

$('saveBtn').addEventListener('click', () => {
  const date = $('dateInput').value;
  const name = $('nameInput').value.trim();
  if (!date) { showToast('请选择日期'); return; }
  if (!selectedBrand) { showToast('请选择品牌'); return; }

  const record = {
    id: Date.now(), date,
    brand: selectedBrand, name: name || '',
    sugar: selectedSugar || '未选择', ice: selectedIce || '未选择',
    rating: selectedEmoji || '', price: $('priceInput').value ? parseFloat($('priceInput').value) : null
  };

  const records = getRecords(currentUser);
  records.unshift(record);
  saveRecordsLocal(currentUser, records);
  syncToGitHub(currentUser);
  resetForm();
  $('formWrap').classList.remove('open');
  $('formToggle').textContent = '➕ 添加记录';

  const d = new Date(date);
  if (d.getFullYear() !== viewYear || d.getMonth() + 1 !== viewMonth) {
    viewYear = d.getFullYear(); viewMonth = d.getMonth() + 1;
  }
  selectedDate = date;
  renderCalendar(); renderStats(); renderList(); updateListHeader();
  showToast('已记录 ✓');
});

/* ==================== 日历 ==================== */
function getMonthDateStr(y, m, d) { return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }

function renderCalendar() {
  $('monthTitle').textContent = `${viewYear}年 ${viewMonth}月`;
  $('calendarGrid').innerHTML = '';
  const firstDay = new Date(viewYear, viewMonth - 1, 1).getDay();
  const lastDate = new Date(viewYear, viewMonth, 0).getDate();
  const prevLastDate = new Date(viewYear, viewMonth - 1, 0).getDate();
  const prevYear = viewMonth === 1 ? viewYear - 1 : viewYear;
  const prevMonth = viewMonth === 1 ? 12 : viewMonth - 1;
  const nextYear = viewMonth === 12 ? viewYear + 1 : viewYear;
  const nextMonth = viewMonth === 12 ? 1 : viewMonth + 1;

  const records = getRecords(currentUser);
  const dateMap = {};
  records.forEach(r => {
    if (!dateMap[r.date]) dateMap[r.date] = [];
    const items = dateMap[r.date];
    const ini = r.brand.charAt(0);
    if (!items.some(x => x.initial === ini)) {
      items.push({ initial: ini, color: getBrandColor(r.brand, currentUser) });
    }
  });

  for (let i = firstDay - 1; i >= 0; i--) {
    const d = prevLastDate - i;
    appendDay(d, 'other-month', getMonthDateStr(prevYear, prevMonth, d));
  }
  for (let d = 1; d <= lastDate; d++) {
    appendDay(d, '', getMonthDateStr(viewYear, viewMonth, d));
  }
  const totalCells = firstDay + lastDate;
  const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for (let d = 1; d <= remaining; d++) {
    appendDay(d, 'other-month', getMonthDateStr(nextYear, nextMonth, d));
  }

  function appendDay(dayNum, extraClass, dateStr) {
    const div = document.createElement('div');
    div.dataset.date = dateStr;
    div.className = 'day-cell' + (extraClass ? ' ' + extraClass : '');
    if (dateStr === todayStr) div.classList.add('today');
    if (dateStr === selectedDate) div.classList.add('selected');
    const numSpan = document.createElement('span');
    numSpan.className = 'day-num'; numSpan.textContent = dayNum;
    div.appendChild(numSpan);
    if (!extraClass && dateMap[dateStr]) {
      const icons = document.createElement('span');
      icons.className = 'day-icons';
      dateMap[dateStr].slice(0, 3).forEach(item => {
        const badge = document.createElement('span');
        badge.className = 'day-badge';
        badge.style.background = item.color; badge.textContent = item.initial;
        icons.appendChild(badge);
      });
      div.appendChild(icons);
    }
    div.addEventListener('click', () => {
      if (extraClass) {
        const [y, m] = dateStr.split('-');
        viewYear = parseInt(y); viewMonth = parseInt(m);
      }
      selectedDate = dateStr; $('dateInput').value = selectedDate;
      renderCalendar(); renderStats(); renderList(); updateListHeader();
    });
    $('calendarGrid').appendChild(div);
  }
}

function updateListHeader() {
  const d = new Date(selectedDate);
  $('listHeader').textContent = `📋 ${d.getMonth() + 1}月${d.getDate()}日 周${['日','一','二','三','四','五','六'][d.getDay()]} 记录`;
}

/* ==================== 统计 ==================== */
function daysSince(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  const t = new Date(todayStr);
  return Math.floor((t - d) / (1000 * 60 * 60 * 24));
}
function findLatest(teaOrCoffee) {
  const records = getRecords(currentUser);
  let latest = null;
  records.forEach(r => {
    const isC = coffeeBrands.has(r.brand);
    if (teaOrCoffee === 'coffee' && !isC) return;
    if (teaOrCoffee === 'tea' && isC) return;
    if (!latest || r.date > latest) latest = r.date;
  });
  return latest;
}

function renderStats() {
  const lastTea = findLatest('tea');
  const lastCoffee = findLatest('coffee');
  const lastAll = lastTea && lastCoffee ? (lastTea > lastCoffee ? lastTea : lastCoffee) : (lastTea || lastCoffee);
  const allDays = daysSince(lastAll);
  $('statItem').innerHTML = `
    <div class="stat-icon">☕</div>
    <div class="stat-label">距上次喝饮品</div>
    <div class="stat-value">${allDays !== null ? (allDays === 0 ? '今天' : allDays + ' 天') : '暂无记录'}</div>
  `;
}

/* ==================== 记录列表 ==================== */
function deleteRecord(id) {
  let records = getRecords(currentUser);
  records = records.filter(r => r.id !== id);
  saveRecordsLocal(currentUser, records);
  syncToGitHub(currentUser);
  renderCalendar(); renderStats(); renderList(); showToast('已删除');
}

function renderList() {
  const records = getRecords(currentUser).filter(r => r.date === selectedDate);
  if (records.length === 0) {
    $('listContainer').innerHTML = '<div class="empty-tip">这天还没有记录</div>';
    return;
  }
  $('listContainer').innerHTML = records.map(r => {
    const color = getBrandColor(r.brand, currentUser);
    const initial = r.brand.charAt(0);
    const priceStr = r.price != null ? `¥${r.price}` : '';
    const tags = [];
    if (r.sugar) tags.push(r.sugar);
    if (r.ice) tags.push(r.ice);
    return `<div class="record-item">
      <div class="record-brand-badge" style="background:${color}">${initial}</div>
      <div class="record-info">
        <div class="record-top"><span class="record-brand">${escapeHtml(r.brand)}</span></div>
        ${r.name ? `<div class="record-name">${escapeHtml(r.name)}</div>` : ''}
        <div class="record-tags">
          ${tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}
          ${r.rating ? `<span class="record-rating">${r.rating}</span>` : ''}
        </div>
      </div>
      <div class="record-right">
        <button class="record-del" data-id="${r.id}">×</button>
        ${priceStr ? `<span class="record-price">${priceStr}</span>` : ''}
      </div>
    </div>`;
  }).join('');
  $('listContainer').querySelectorAll('.record-del').forEach(btn => {
    btn.addEventListener('click', () => deleteRecord(Number(btn.dataset.id)));
  });
}

/* ==================== 月份导航 ==================== */
$('btnPrev').addEventListener('click', () => {
  if (viewMonth === 1) { viewMonth = 12; viewYear--; }
  else viewMonth--;
  renderCalendar(); renderStats();
});
$('btnNext').addEventListener('click', () => {
  if (viewMonth === 12) { viewMonth = 1; viewYear++; }
  else viewMonth++;
  renderCalendar(); renderStats();
});

/* ==================== 初始化 ==================== */
(function init() {
  adminConfig = getAdminConfig();
  const savedUser = localStorage.getItem(CUR_USER_KEY);
  if (savedUser) {
    showMainView(savedUser);
  } else {
    showLoginView();
  }
})();
</script>
