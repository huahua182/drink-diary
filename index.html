<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>喝了点啥</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #e3f2fd;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 16px;
  padding-bottom: 40px;
}

.container {
  width: 100%;
  max-width: 440px;
}

/* 头部 */
.header {
  text-align: center;
  padding: 24px 0 16px;
}
.header h1 {
  font-size: 26px;
  color: #1565c0;
  font-weight: 700;
  letter-spacing: 2px;
}

/* 表单卡片 */
.card {
  background: #fff;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 2px 12px rgba(21, 101, 192, 0.08);
  margin-bottom: 16px;
}

/* 区块标签 */
.section-label {
  display: block;
  font-size: 13px;
  color: #999;
  margin-bottom: 8px;
  font-weight: 500;
}

/* 区块间距 */
.section {
  margin-bottom: 18px;
}

/* 日期选择器 */
.date-input {
  width: 100%;
  padding: 12px 14px;
  font-size: 16px;
  border: 2px solid #e0e0e0;
  border-radius: 12px;
  outline: none;
  color: #333;
  background: #fafafa;
  transition: border-color 0.2s;
  -webkit-appearance: none;
}
.date-input:focus { border-color: #64b5f6; }

/* 品牌选择网格 */
.brand-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.brand-btn {
  padding: 10px 4px;
  font-size: 13px;
  font-weight: 500;
  border: 2px solid #e8e8e8;
  border-radius: 10px;
  background: #fafafa;
  cursor: pointer;
  text-align: center;
  color: #555;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.brand-btn:active { transform: scale(0.94); }
.brand-btn.selected {
  border-color: #64b5f6;
  background: #e3f2fd;
  color: #1565c0;
  font-weight: 600;
}
.brand-btn.custom {
  border-style: dashed;
  position: relative;
}
.brand-btn.custom .brand-del {
  position: absolute;
  top: -5px;
  right: -5px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #eee;
  border: none;
  font-size: 10px;
  color: #999;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  line-height: 1;
}
.brand-btn.custom:hover .brand-del,
.brand-btn.custom:active .brand-del { display: flex; }
.brand-add {
  padding: 10px 4px;
  font-size: 20px;
  font-weight: 300;
  border: 2px dashed #d0d0d0;
  border-radius: 10px;
  background: #fafafa;
  cursor: pointer;
  text-align: center;
  color: #bbb;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.brand-add:active { background: #e3f2fd; color: #64b5f6; border-color: #64b5f6; }
.brand-input-wrap {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}
.brand-input-wrap.hidden { display: none; }
.brand-input {
  flex: 1;
  padding: 8px 10px;
  font-size: 14px;
  border: 2px solid #e0e0e0;
  border-radius: 8px;
  outline: none;
  background: #fafafa;
}
.brand-input:focus { border-color: #64b5f6; }
.brand-input::placeholder { color: #ccc; font-size: 13px; }
.brand-confirm {
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 600;
  color: #fff;
  background: #64b5f6;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.brand-confirm:active { background: #42a5f5; }

/* 文本输入 */
.text-input {
  width: 100%;
  padding: 12px 14px;
  font-size: 16px;
  border: 2px solid #e0e0e0;
  border-radius: 12px;
  outline: none;
  color: #333;
  background: #fafafa;
  transition: border-color 0.2s;
}
.text-input:focus { border-color: #64b5f6; }
.text-input::placeholder { color: #bbb; }

/* 选项按钮行 */
.option-row {
  display: flex;
  gap: 8px;
}
.option-row.cols-5 > * { flex: 1; }

.option-btn {
  flex: 1;
  padding: 10px 6px;
  font-size: 13px;
  font-weight: 500;
  border: 2px solid #e8e8e8;
  border-radius: 10px;
  background: #fafafa;
  cursor: pointer;
  text-align: center;
  color: #666;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.option-btn:active { transform: scale(0.94); }
.option-btn.selected {
  border-color: #64b5f6;
  background: #e3f2fd;
  color: #1565c0;
  font-weight: 600;
}

/* 表情评分按钮 */
.emoji-row {
  display: flex;
  gap: 8px;
}
.emoji-btn {
  flex: 1;
  padding: 10px 0;
  font-size: 26px;
  border: 2px solid #e8e8e8;
  border-radius: 12px;
  background: #fafafa;
  cursor: pointer;
  text-align: center;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.emoji-btn:active { transform: scale(0.92); }
.emoji-btn.selected {
  border-color: #64b5f6;
  background: #e3f2fd;
  transform: scale(1.08);
}

/* 价格输入 */
.price-input {
  width: 140px;
  padding: 12px 14px;
  font-size: 16px;
  border: 2px solid #e0e0e0;
  border-radius: 12px;
  outline: none;
  color: #333;
  background: #fafafa;
  transition: border-color 0.2s;
}
.price-input:focus { border-color: #64b5f6; }
.price-input::placeholder { color: #bbb; }
.price-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
}
.price-wrap span { color: #888; font-size: 15px; }

/* 保存按钮 */
.save-btn {
  width: 100%;
  padding: 14px;
  font-size: 17px;
  font-weight: 600;
  color: #fff;
  background: #64b5f6;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 2px;
  -webkit-tap-highlight-color: transparent;
  margin-top: 4px;
}
.save-btn:active { transform: scale(0.97); background: #42a5f5; }

/* 分割线 */
.divider {
  border: none;
  border-top: 1px solid #f0f0f0;
  margin: 4px 0 16px;
}

/* 记录列表 */
.list-header {
  font-size: 15px;
  color: #1565c0;
  font-weight: 600;
  margin-bottom: 10px;
  padding-left: 4px;
}
.empty-tip {
  text-align: center;
  color: #aaa;
  font-size: 14px;
  padding: 32px 0;
}
.record-item {
  display: flex;
  align-items: flex-start;
  padding: 14px 16px;
  background: #fff;
  border-radius: 12px;
  margin-bottom: 8px;
  box-shadow: 0 1px 6px rgba(21, 101, 192, 0.05);
  gap: 10px;
}
.record-brand-badge {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}
.record-info { flex: 1; min-width: 0; }
.record-top {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}
.record-date { font-size: 12px; color: #999; }
.record-brand { font-size: 13px; color: #555; font-weight: 600; }
.record-name { font-size: 15px; color: #333; font-weight: 500; margin-bottom: 5px; }
.record-tags {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.tag {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 6px;
  background: #f0f4ff;
  color: #5c7cb0;
  font-weight: 500;
}
.record-rating { font-size: 18px; }
.record-price { font-size: 14px; color: #888; font-weight: 500; }
.record-right { text-align: right; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.record-del {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: none;
  background: #f0f0f0;
  color: #bbb;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.record-del:active { background: #ffebee; color: #e53935; }

/* Toast 提示 */
.toast {
  position: fixed;
  top: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: #333;
  color: #fff;
  padding: 10px 24px;
  border-radius: 20px;
  font-size: 14px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
  z-index: 100;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🧋 喝了点啥</h1>
  </div>

  <!-- 记录表单 -->
  <div class="card">
    <!-- 日期 -->
    <div class="section">
      <span class="section-label">📅 选择日期</span>
      <input type="date" class="date-input" id="dateInput">
    </div>

    <!-- 品牌选择 -->
    <div class="section">
      <span class="section-label">🏪 选择品牌</span>
      <div class="brand-grid" id="brandGrid"></div>
      <div class="brand-input-wrap hidden" id="brandInputWrap">
        <input type="text" class="brand-input" id="brandInput" placeholder="输入品牌名...">
        <button class="brand-confirm" id="brandConfirm">添加</button>
      </div>
    </div>

    <!-- 饮品名称 -->
    <div class="section">
      <span class="section-label">📝 饮品名称</span>
      <input type="text" class="text-input" id="nameInput" placeholder="比如：伯牙绝弦、生椰拿铁...">
    </div>

    <!-- 糖度 -->
    <div class="section">
      <span class="section-label">🍬 糖度</span>
      <div class="option-row cols-5" id="sugarRow"></div>
    </div>

    <!-- 冰度 -->
    <div class="section">
      <span class="section-label">🧊 冰度</span>
      <div class="option-row cols-5" id="iceRow"></div>
    </div>

    <!-- 味道评价 -->
    <div class="section">
      <span class="section-label">👅 味道评价</span>
      <div class="emoji-row" id="emojiRow"></div>
    </div>

    <!-- 价格 -->
    <div class="section">
      <span class="section-label">💰 价格（选填）</span>
      <div class="price-wrap">
        <span>¥</span>
        <input type="number" class="price-input" id="priceInput" placeholder="18" step="0.01" min="0">
      </div>
    </div>

    <!-- 保存按钮 -->
    <button class="save-btn" id="saveBtn">➕ 记录</button>
  </div>

  <!-- 历史记录 -->
  <div class="list-header">📋 最近记录</div>
  <div id="listContainer"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'drink_records_v2';
const CUSTOM_BRANDS_KEY = 'custom_brands';

/* ---- 预置品牌 ---- */
const presetBrands = [
  { name: '霸王茶姬', color: '#c8a25c' },
  { name: '喜茶',     color: '#f4a460' },
  { name: '奈雪的茶', color: '#7bcfa6' },
  { name: '茶百道',   color: '#5b8c5a' },
  { name: '古茗',     color: '#c9956b' },
  { name: '蜜雪冰城', color: '#e53935' },
  { name: '瑞幸',     color: '#2563a8' },
  { name: '库迪',     color: '#e8753c' },
  { name: '星巴克',   color: '#00704a' },
  { name: '一点点',   color: '#f9a825' },
  { name: '沪上阿姨', color: '#d81b60' },
  { name: '茶颜悦色', color: '#8b4513' },
];

/* 自定义品牌颜色池 */
const customColors = ['#7e57c2','#26a69a','#ef5350','#ff7043','#42a5f5','#ab47bc','#66bb6a','#ffa726','#8d6e63','#78909c'];

function getCustomBrands() {
  try { return JSON.parse(localStorage.getItem(CUSTOM_BRANDS_KEY)) || []; }
  catch { return []; }
}
function saveCustomBrands(list) {
  localStorage.setItem(CUSTOM_BRANDS_KEY, JSON.stringify(list));
}
function getAllBrands() {
  return [...presetBrands, ...getCustomBrands()];
}

/* ---- 选项数据 ---- */
const sugarOptions = ['无糖', '三分糖', '五分糖', '七分糖', '全糖'];
const iceOptions = ['热', '常温', '去冰', '少冰', '正常冰'];
const emojiOptions = ['😫','😐','🙂','😊','🤩'];

/* ---- 当前选中值 ---- */
let selectedBrand = '';
let selectedSugar = '';
let selectedIce = '';
let selectedEmoji = '';

/* 工具：创建选项按钮组 */
function buildOptionRow(containerId, options, getter, setter) {
  const row = document.getElementById(containerId);
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = containerId === 'emojiRow' ? 'emoji-btn' : 'option-btn';
    btn.textContent = opt;
    btn.addEventListener('click', () => {
      if (getter() === opt) {
        setter('');
        btn.classList.remove('selected');
      } else {
        row.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
        setter(opt);
        btn.classList.add('selected');
      }
    });
    row.appendChild(btn);
  });
}

/* 工具：构建品牌网格 */
function buildBrandGrid() {
  const grid = document.getElementById('brandGrid');
  grid.innerHTML = '';

  const allBrands = getAllBrands();
  const customBrands = getCustomBrands();

  allBrands.forEach((b, idx) => {
    const isCustom = idx >= presetBrands.length;
    const btn = document.createElement('button');
    btn.className = 'brand-btn' + (isCustom ? ' custom' : '');
    btn.textContent = b.name;

    if (isCustom) {
      const del = document.createElement('button');
      del.className = 'brand-del';
      del.textContent = '×';
      del.addEventListener('click', (e) => {
        e.stopPropagation();
        const updated = getCustomBrands().filter(cb => cb.name !== b.name);
        saveCustomBrands(updated);
        if (selectedBrand === b.name) selectedBrand = '';
        buildBrandGrid();
        renderList();
      });
      btn.appendChild(del);
    }

    if (b.name === selectedBrand) btn.classList.add('selected');

    btn.addEventListener('click', () => {
      if (selectedBrand === b.name) {
        selectedBrand = '';
        btn.classList.remove('selected');
      } else {
        grid.querySelectorAll('button.brand-btn').forEach(el => el.classList.remove('selected'));
        selectedBrand = b.name;
        btn.classList.add('selected');
      }
    });
    grid.appendChild(btn);
  });

  // + 添加按钮
  const addBtn = document.createElement('button');
  addBtn.className = 'brand-add';
  addBtn.textContent = '+';
  addBtn.title = '添加品牌';
  addBtn.addEventListener('click', () => {
    document.getElementById('brandInputWrap').classList.toggle('hidden');
    document.getElementById('brandInput').focus();
  });
  grid.appendChild(addBtn);
}

/* DOM */
const dateInput = document.getElementById('dateInput');
const nameInput = document.getElementById('nameInput');
const priceInput = document.getElementById('priceInput');
const saveBtn = document.getElementById('saveBtn');
const listContainer = document.getElementById('listContainer');
const toast = document.getElementById('toast');

dateInput.value = new Date().toISOString().split('T')[0];

/* 构建 UI */
buildBrandGrid();
buildOptionRow('sugarRow', sugarOptions,
  () => selectedSugar, v => { selectedSugar = v; });
buildOptionRow('iceRow', iceOptions,
  () => selectedIce, v => { selectedIce = v; });
buildOptionRow('emojiRow', emojiOptions,
  () => selectedEmoji, v => { selectedEmoji = v; });

/* localStorage */
function getRecords() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
function saveRecords(records) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
}

/* Toast */
let toastTimer;
function showToast(msg) {
  clearTimeout(toastTimer);
  toast.textContent = msg;
  toast.classList.add('show');
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
}

/* 获取品牌颜色 */
function getBrandColor(name) {
  const b = getAllBrands().find(b => b.name === name);
  return b ? b.color : '#999';
}
function getBrandInitial(name) {
  return name ? name.charAt(0) : '?';
}

/* 添加自定义品牌 */
document.getElementById('brandConfirm').addEventListener('click', () => {
  const input = document.getElementById('brandInput');
  const name = input.value.trim();
  if (!name) return;
  const exists = getAllBrands().some(b => b.name === name);
  if (exists) { showToast('该品牌已存在'); return; }
  const list = getCustomBrands();
  const color = customColors[list.length % customColors.length];
  list.push({ name, color });
  saveCustomBrands(list);
  input.value = '';
  document.getElementById('brandInputWrap').classList.add('hidden');
  buildBrandGrid();
  showToast('已添加 ✅');
});
document.getElementById('brandInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('brandConfirm').click();
});

/* 重置表单 */
function resetForm() {
  selectedBrand = '';
  selectedSugar = '';
  selectedIce = '';
  selectedEmoji = '';
  nameInput.value = '';
  priceInput.value = '';
  document.querySelectorAll('.brand-btn, .option-btn, .emoji-btn')
    .forEach(b => b.classList.remove('selected'));
  document.getElementById('brandInputWrap').classList.add('hidden');
  document.getElementById('brandInput').value = '';
}

/* 保存 */
saveBtn.addEventListener('click', () => {
  const date = dateInput.value;
  const name = nameInput.value.trim();

  if (!date) { showToast('请选择日期'); return; }
  if (!selectedBrand) { showToast('请选择品牌'); return; }
  if (!name) { showToast('请输入饮品名称'); return; }

  const priceVal = priceInput.value ? parseFloat(priceInput.value) : null;

  const record = {
    id: Date.now(),
    date,
    brand: selectedBrand,
    name,
    sugar: selectedSugar || '未选择',
    ice: selectedIce || '未选择',
    rating: selectedEmoji || '',
    price: priceVal
  };

  const records = getRecords();
  records.unshift(record);
  saveRecords(records);
  resetForm();
  renderList();
  showToast('已记录 ✅');
});

/* 删除 */
function deleteRecord(id) {
  let records = getRecords();
  records = records.filter(r => r.id !== id);
  saveRecords(records);
  renderList();
  showToast('已删除');
}

/* 渲染列表 */
function renderList() {
  const records = getRecords();

  if (records.length === 0) {
    listContainer.innerHTML = '<div class="empty-tip">还没有记录，来记一杯吧 🧋</div>';
    return;
  }

  listContainer.innerHTML = records.map(r => {
    const d = new Date(r.date);
    const dateStr = `${d.getMonth() + 1}月${d.getDate()}日`;
    const weekDay = ['日','一','二','三','四','五','六'][d.getDay()];
    const color = getBrandColor(r.brand);
    const initial = getBrandInitial(r.brand);
    const priceStr = r.price != null ? `¥${r.price}` : '';
    const tags = [];
    if (r.sugar) tags.push(r.sugar);
    if (r.ice) tags.push(r.ice);

    return `
      <div class="record-item">
        <div class="record-brand-badge" style="background:${color}">${initial}</div>
        <div class="record-info">
          <div class="record-top">
            <span class="record-date">${dateStr} 周${weekDay}</span>
            <span class="record-brand">${escapeHtml(r.brand)}</span>
          </div>
          <div class="record-name">${escapeHtml(r.name)}</div>
          <div class="record-tags">
            ${tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}
            ${r.rating ? `<span class="record-rating">${r.rating}</span>` : ''}
          </div>
        </div>
        <div class="record-right">
          <button class="record-del" data-id="${r.id}">×</button>
          ${priceStr ? `<span class="record-price">${priceStr}</span>` : ''}
        </div>
      </div>
    `;
  }).join('');

  listContainer.querySelectorAll('.record-del').forEach(btn => {
    btn.addEventListener('click', () => deleteRecord(Number(btn.dataset.id)));
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

renderList();
</script>
</body>
</html>
